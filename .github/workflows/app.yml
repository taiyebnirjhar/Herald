name: App (APK)

# Phase 0.4 + 0.5: analyze, test and build a signed arm64 APK.
# Tags v* also publish the APK to a GitHub Release (owner installs from there).

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**", "docs/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a GitHub Release with this tag, e.g. v0.1.0 (leave empty to only build)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"
  JAVA_VERSION: "17"

jobs:
  build:
    name: Analyze, test, build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Write release signing key (from secrets, never committed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error title=Signing secrets missing::Add ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in repo Settings > Secrets and variables > Actions. See README 'Signing key'."
            exit 1
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/herald-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE_PATH"
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=%s\n' "$KEYSTORE_PATH"
          } > android/key.properties

      - name: Work out version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF_NAME#v}"
          elif [[ -n "$RELEASE_TAG" ]]; then
            NAME="${RELEASE_TAG#v}"
          else
            NAME="0.1.0"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version name: $NAME, build number: $GITHUB_RUN_NUMBER"

      - name: Build release APK (arm64 only)
        run: >
          flutter build apk --release --target-platform android-arm64
          --build-name "${{ steps.version.outputs.name }}"
          --build-number "$GITHUB_RUN_NUMBER"

      - name: Verify APK (signature, targetSdk 28, arm64 only)
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK"
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "SdkVersion|native-code|package:"
          echo "$BADGING" | grep -q "targetSdkVersion:'28'" || { echo "::error::targetSdk is not 28"; exit 1; }
          echo "$BADGING" | grep -q "minSdkVersion:'29'" || { echo "::error::minSdk is not 29"; exit 1; }
          echo "$BADGING" | grep -q "native-code: 'arm64-v8a'" || { echo "::error::native code is not arm64-v8a only"; exit 1; }
          APK_NAME="herald-${{ steps.version.outputs.name }}-arm64.apk"
          cp "$APK" "$RUNNER_TEMP/$APK_NAME"
          # Checksum next to the APK: the app checks its download against it (docs/DECISIONS.md, 11.3).
          (cd "$RUNNER_TEMP" && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          cat "$RUNNER_TEMP/$APK_NAME.sha256"
          echo "APK_PATH=$RUNNER_TEMP/$APK_NAME" >> "$GITHUB_ENV"
          echo "SHA_PATH=$RUNNER_TEMP/$APK_NAME.sha256" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: herald-apk-${{ steps.version.outputs.name }}-run${{ github.run_number }}
          path: |
            ${{ env.APK_PATH }}
            ${{ env.SHA_PATH }}
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: herald-apk-*
          path: release
          merge-multiple: true

      - name: Create release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: |
            release/*.apk
            release/*.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
